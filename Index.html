<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinanceFlow — Controle Financeiro</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="Front.css">
</head>
<body>

<div class="glow-accent"></div>

<div class="container">

  <!-- HEADER -->
  <header>
    <div class="logo">
      <div>
        <div class="logo-main">FinanceFlow</div>
        <div class="logo-sub">Controle Financeiro Pessoal</div>
      </div>
    </div>
    <div class="header-badge">⚡ v2.0</div>
  </header>

  <!-- SALÁRIO -->
  <div class="card">
    <div class="section-title">💰 Renda Mensal</div>
    <div class="grid-2">
      <div class="field">
        <label>Salário Líquido (R$)</label>
        <input type="number" id="salario" placeholder="Ex: 3500.00" min="0" step="0.01">
      </div>
      <div class="field">
        <label>Renda Extra Mensal (R$)</label>
        <input type="number" id="renda-extra" placeholder="Ex: 500.00" min="0" step="0.01" value="0">
      </div>
    </div>
  </div>

  <!-- DÍVIDAS -->
  <div class="card">
    <div class="section-title">📋 Dívidas e Despesas Fixas</div>

    <div class="debt-form-grid">
      <div class="field">
        <label>Nome da Dívida</label>
        <input type="text" id="debt-name" placeholder="Ex: Cartão de crédito">
      </div>
      <div class="field">
        <label>Valor Mensal (R$)</label>
        <input type="number" id="debt-value" placeholder="Ex: 350.00" min="0" step="0.01">
      </div>
      <div class="field">
        <label>Parcelas Restantes</label>
        <input type="number" id="debt-months" placeholder="Ex: 12" min="1">
      </div>
      <div class="field">
        <label>Categoria</label>
        <select id="debt-category">
          <option value="divida">💳 Dívida</option>
          <option value="fixo">🏠 Despesa Fixa</option>
          <option value="financiamento">🚗 Financiamento</option>
          <option value="emprestimo">🏦 Empréstimo</option>
          <option value="outro">📌 Outro</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="addDebt()">+ Adicionar</button>
    </div>

    <div id="debt-list" class="debt-list">
      <div class="empty-state" id="debt-empty">Nenhuma dívida adicionada ainda. Adicione acima ↑</div>
    </div>
  </div>

  <!-- OBJETIVO -->
  <div class="card">
    <div class="section-title">🎯 Objetivo Financeiro</div>
    <div class="grid-3">
      <div class="field">
        <label>Nome do Objetivo</label>
        <input type="text" id="goal-name" placeholder="Ex: Viagem Europa">
      </div>
      <div class="field">
        <label>Valor Total (R$)</label>
        <input type="number" id="goal-total" placeholder="Ex: 15000.00" min="0" step="0.01">
      </div>
      <div class="field">
        <label>Já Guardado (R$)</label>
        <input type="number" id="goal-saved" placeholder="Ex: 2000.00" min="0" step="0.01" value="0">
      </div>
      <div class="field">
        <label>Quanto Guardar p/ Mês (R$)</label>
        <input type="number" id="goal-monthly" placeholder="Ex: 500.00" min="0" step="0.01">
      </div>
      <div class="field">
        <label>Data de Início</label>
        <input type="month" id="goal-start" style="color-scheme: dark;">
      </div>
    </div>
  </div>

  <!-- BOTÃO CALCULAR -->
  <div style="text-align:center; margin: 32px 0;">
    <button class="btn btn-primary" style="padding: 16px 48px; font-size: 1rem;" onclick="calcular()">
      ⚡ Calcular Finanças
    </button>
  </div>

  <!-- RESULTADOS -->
  <div id="results-section" class="hidden">

    <!-- RESUMO GERAL -->
    <div class="section-title" style="margin-top:12px;">📊 Resumo Geral</div>
    <div class="grid-3" style="margin-bottom:24px;" id="stats-grid"></div>

    <!-- BALANÇO MENSAL -->
    <div class="card highlight-card" id="balanco-card">
      <div class="section-title">📈 Balanço Mensal</div>
      <div id="balanco-content"></div>
    </div>

    <!-- OBJETIVO DETALHE -->
    <div class="card" id="goal-card">
      <div class="section-title">🎯 Progresso do Objetivo</div>
      <div id="goal-content"></div>
    </div>

    <!-- CRONOGRAMA MENSAL -->
    <div class="card" id="cronograma-card">
      <div class="section-title">📅 Cronograma Mensal</div>
      <div style="overflow-x:auto;">
        <table class="month-table" id="month-table">
          <thead>
            <tr>
              <th>Mês</th>
              <th>Receita</th>
              <th>Dívidas</th>
              <th>Guardado</th>
              <th>Saldo Livre</th>
              <th>Acumulado Obj.</th>
            </tr>
          </thead>
          <tbody id="month-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- EXPORT -->
    <div class="export-area">
      <button class="btn btn-success" onclick="exportarExcel()">
        📊 Exportar Planilha Excel
      </button>
      <button class="btn btn-secondary" onclick="scrollToTop()">
        ↑ Editar Dados
      </button>
    </div>

  </div>

</div>

<button class="scroll-top" onclick="scrollToTop()" title="Voltar ao topo">↑</button>

<script src="Back.js"></script>

</body>
</html>
